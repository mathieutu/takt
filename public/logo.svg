<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .primary { fill: #ec4899; }
    .filled  { fill: #64748b; }
    .ghost   { fill: rgba(15, 23, 42, 0.15); }
    @media (prefers-color-scheme: dark) {
      .filled { fill: #f1f5f9; }
      .ghost  { fill: rgba(241, 245, 249, 0.15); }
    }
  </style>
  <!-- Row 1 : ○ ◆ ◆ ◆ -->
  <rect x="2.5" y="2.5" width="20" height="20" rx="4" class="ghost"/>
  <rect x="27.5" y="2.5" width="20" height="20" rx="4" class="primary"/>
  <rect x="52.5" y="2.5" width="20" height="20" rx="4" class="primary"/>
  <rect x="77.5" y="2.5" width="20" height="20" rx="4" class="primary"/>
  <!-- Row 2 : ● ● ◆ ● -->
  <rect x="2.5" y="27.5" width="20" height="20" rx="4" class="filled"/>
  <rect x="27.5" y="27.5" width="20" height="20" rx="4" class="filled"/>
  <rect x="52.5" y="27.5" width="20" height="20" rx="4" class="primary"/>
  <rect x="77.5" y="27.5" width="20" height="20" rx="4" class="filled"/>
  <!-- Row 3 : ● ● ◆ ● -->
  <rect x="2.5" y="52.5" width="20" height="20" rx="4" class="filled"/>
  <rect x="27.5" y="52.5" width="20" height="20" rx="4" class="filled"/>
  <rect x="52.5" y="52.5" width="20" height="20" rx="4" class="primary"/>
  <rect x="77.5" y="52.5" width="20" height="20" rx="4" class="filled"/>
  <!-- Row 4 : ● ● ○ ○ -->
  <rect x="2.5" y="77.5" width="20" height="20" rx="4" class="filled"/>
  <rect x="27.5" y="77.5" width="20" height="20" rx="4" class="filled"/>
  <rect x="52.5" y="77.5" width="20" height="20" rx="4" class="ghost"/>
  <rect x="77.5" y="77.5" width="20" height="20" rx="4" class="ghost"/>
</svg>
